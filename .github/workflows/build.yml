name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GDAL comes from the distribution (CMake's FindGDAL module picks it up),
      # plog is downloaded by CMake itself. Nothing else is required.
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAverageData_mt_FETCH_PLOG=ON

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python 3.12 / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --frozen: fail instead of silently updating uv.lock, so CI tests exactly
      # the dependency set that is committed. GDAL comes inside the rasterio
      # wheels, nothing has to be installed system-wide.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Test
        run: uv run pytest
